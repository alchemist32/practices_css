<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pokemon.css">
    <title>Pokemons</title>
</head>
<body>
    <main class="full-width-container">
        <section class="container">
            <!--Pokemon small-->
            <section class="small">
                <div class="pichu"><img src="https://static.wikia.nocookie.net/espokemon/images/9/9d/Pichu.png/revision/latest?cb=20150620210539" alt="Pichu"></div>
                <div class="charmander"><img src="https://images.wikidexcdn.net/mwuploads/wikidex/thumb/5/56/latest/20200307023245/Charmander.png/800px-Charmander.png" alt="Charmander"></div>
                <div class="squirtle" ><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/007.png" alt="Squirtle"></div>
                <div class="bulbasaur" ><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/001.png" alt="Bulbasaur"></div>
                <div class="abra"><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/063.png" alt="Abra"></div>
            </section>
            
            <!--Pokemon medium-->
            <section class="medium">
                <div class="pikachu" ><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/025.png" alt="Pikachu"></div>
                <div class="charmileon" ><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/005.png" alt="Charmander"></div>
                <div class="wartortle" ><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/008.png" alt="Squirtle"></div>
                <div class="ivysour"><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/002.png" alt="Bulbasaur"></div>
                <div class="kadabra"><img  src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/064.png" alt="Abra"></div>
            </section>
            
            <!--Pokemon evo-->
            <section class="evo">
                <div class="raichu"><img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/026.png" alt="Pikachu"></div>
                <div class="charizard"><img  src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/006.png" alt="Charmander"></div>
                <div class="blastoise"><img  src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/009.png" alt="Squirtle"></div>
                <div class="venusaur"><img  src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/003.png" alt="Bulbasaur"></div>
                <div class="alakazam"><img  src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/065.png" alt="Abra"></div>
            </section>
        </section>
    </main>
</body>
</html>
