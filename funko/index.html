<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funko Pop Mulán</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!---Estructura del funko-->
    <section class="funko">
      <!---Cabeza del funko-->
      <section class="mulan__head">
        <div class="head__hair"></div>
        <div class="head__hair--left"></div>
        <div class="head__hair--right"></div>
        <div class="head__hair--lock"></div>
        <div class="head__base"></div>
        <!---Ojo izquierdo del funko-->
        <div class="eye__left eye">
          <div class="eye__left--light eye__light"></div>
        </div>
        <!---Ojo derecho del funko-->
        <div class="eye__right eye">
          <div class="eye__right--light eye__light"></div>
        </div>
        <div class="nose"></div>
      </section>
      <!---Cuerpo del funko-->
      <section class="mulan__body">
        <!---Parte superior del cuerpo-->
        <div class="body__top--base">
          <div class="top__wear--leftblue"></div>
          <div class="top__wear--leftred"></div>
          <div class="top__wear--rightblue"></div>
          <div class="top__wear--rightred"></div>
          <div class="left__arm--top"></div>
          <div class="right__arm--top"></div>
        </div>
        <!--Mitad del funko -->
        <div class="body__middle"></div>
        <div class="left__arm--bottom"></div>
        <div class="left__arm--hand"></div>
        <div class="right__arm--bottom"></div>
        <div class="right__arm--hand"></div>
        <!---Parte baja del funko-->
        <div class="body__bottom--base">
          <div class="bottom__skirt"></div>
          <div class="top__skirt"></div>
          <div class="large__belt"></div>
          <div class="left__shoe"></div>
          <div class="right__shoe"></div>
        </div>
      </section>
    </section>
  </body>
</html>
