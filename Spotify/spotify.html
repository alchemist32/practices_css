<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="spotify.css">
    <title>Spotify</title>
</head>
<body class="body-container">
    <main id="main">
        <div class="principal-container">
            <nav id="global-nav-bar" class="nav-top">
                <div class="logo-container">
                    <a class="logo" href="#"><img src="logo.png" alt="Spotify" height="32px" width="32px">
                    </a>
                </div>

                <section class="container-bar">
                    <div class="bar-int">
                        <button class="boton-inicio" aria-label="Inicio">
                            <svg viewBox="285 560 20 20" xmlns="http://www.w3.org/2000/svg" fill="#ffffff">
                                <path transform="translate(-285, -560)" d="M299.875,576.21213 C299.875,576.76413 299.399,577.00013 298.8125,577.00013 L297.75,577.00013 ..." />
                            </svg>
                        </button>
                        <div class="search-contain">
                            <div class="search-bar">
                                <div class="search-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="24" height="24" viewBox="0 0 24 24" class="icon1">
                                    <path d="M 21 3 C 11.621094 3 4 10.621094 4 20 C 4 29.378906 11.621094 37 21 37 C 24.710938 37 28.140625 35.804688 30.9375 33.78125 L 44.09375 46.90625 L 46.90625 44.09375 L 33.90625 31.0625 C 36.460938 28.085938 38 24.222656 38 20 C 38 10.621094 30.378906 3 21 3 Z M 21 5 C 29.296875 5 36 11.703125 36 20 C 36 28.296875 29.296875 35 21 35 C 12.703125 35 6 28.296875 6 20 C 6 11.703125 12.703125 5 21 5 Z"></path>
                                    </svg>
                                </div>
                                <input type="text" class="search-input" placeholder="¿Qué quieres reproducir?">
                                <img src="icon.png" alt="Buscar" class="icon">
                            </div>
                        </div>
                    </div>
                </section>
                <section class="rest-nav">
                    <div class="flex-cont">
                        <button class="boton-nav">Premium</button>
                        <button class="boton-nav">Ayuda</button>
                        <button class="boton-nav">Descargar</button>
                        <div class="separador"></div>
                        <button class="boton-nav">Instalar aplicación</button>
                        <div class="botones-log">
                            <button class="boton-nav reg">registrarse</button>
                            <button class="big-boton">Iniciar sesión</button>
                        </div>
                    </div>
                </section>
            </nav>
            <aside id="left-sidebar" class="left-bar" style="width:361px;">
                <nav class="nav-left">
                    <div class="contain-left-items">
                        <div class="mitad-superior">
                            <div>
                                <header class="left-header">
                                    <div class="left-container-one">
                                        <div class="left-titulo">
                                            <span class="texto-titulo">Tu biblioteca</span>
                                        </div>
                                        <div class="boton-playlist">
                                            <button class="boton-mas"></button>
                                        </div>
                                    </div>
                                </header>
                                <div class="separador-left"></div>
                            </div>
                            <div class="slide-container">
                                <div class="slide-items">
                                    <div class="items-left">
                                        <section class="cuadro-texto">
                                            <div class="textos">
                                                <span class="texto-bold">Crea tu primera playlist</span>
                                                <span class="texto-regular">¡Es muy fácil! Te vamos a ayudar</span>
                                            </div>
                                            <div class="boton-section">
                                                <button class="boton-section-item">Crear playlist</button>
                                            </div>
                                        </section>
                                        <section class="cuadro-texto">
                                            <div class="textos">
                                                <span class="texto-bold">Busquemos algunos podcasts para seguir</span>
                                                <span class="texto-regular">Te mantendremos al tanto de los nuevos episodios.</span>
                                            </div>
                                            <div class="boton-section">
                                                <button class="boton-section-item">Explorar podcasts</button>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                                <div class="barra-vertical"></div>
                            </div>

                        </div>
                        <div class="mitad-inferior">
                            <div class="cuadrar-footer">
                                <div class="container-links">
                                    <div class="link-item">
                                        <a class="link-cont"><span class="text-link">Legal</span></a>
                                    </div>
                                    <div class="link-item">
                                        <a class="link-cont"><span class="text-link">Seguridad y Centro de Privacidad</span></a>
                                    </div>
                                    <div class="link-item">
                                        <a class="link-cont"><span class="text-link">Política de Privacidad</span></a>
                                    </div>
                                    <div class="link-item">
                                        <a class="link-cont"><span class="text-link">Cookies</span></a>
                                    </div>
                                    <div class="link-item">
                                        <a class="link-cont"><span class="text-link">Sobre los anuncios</span></a>
                                    </div>
                                    <div class="link-item">
                                        <a class="link-cont"><span class="text-link">Accesibilidad</span></a>
                                    </div>
                                </div>
                                <a class="cookies-link"><span>Cookies</span></a>
                            </div>
                            <div class="container-idioma">
                                <button class="boton-idioma">
                                    <span></span>
                                    Español de Latinoamerica
                                </button>
                            </div>

                        </div>

                    </div>

                </nav>
            </aside>
        </div>
    </main>
    
</body>
</html>
